<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story App - Tambah Cerita Baru</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <!-- Lit Component: App Bar with Offcanvas Menu & i18n -->
    <app-bar activePage="add"></app-bar>

    <main class="py-5">
      <div class="container py-4">
        <!-- Section Header -->
        <div class="text-center mb-5">
          <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill mb-2 px-3 py-2 fw-semibold">
            📸 Form Publikasi Cerita
          </span>
          <h1 class="h2 fw-bold text-dark brand-gradient" data-i18n="newStoryTitle">
            Bagikan Cerita Baru
          </h1>
          <p class="text-secondary mx-auto" style="max-width: 580px;" data-i18n="newStorySubtitle">
            Unggah foto momen terbaik Anda dan sertakan deskripsi cerita yang mendalam untuk dibagikan ke seluruh pengguna.
          </p>
        </div>

        <!-- Story Form Web Component with Bootstrap Validation -->
        <div class="row justify-content-center">
          <div class="col-lg-10">
            <story-form></story-form>
          </div>
        </div>
      </div>
    </main>

    <!-- Lit Component with Shadow DOM: Modern Footer -->
    <footer-bar></footer-bar>
  </body>
</html>
